CONFIG_ZMK_KEYBOARD_NAME="CCK Ball"

# Critical Bluetooth fixes
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# Much more stable connection intervals
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=9    # Increased from 6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=15   # Increased from 9  
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600  # Increased from 400

# Experimental BLE for better stability
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y

# Power management - KEEP SLEEP ENABLED but with better settings
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=60000    # 1 minute sleep
CONFIG_ZMK_EXT_POWER=y

# Hardware
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Mouse
CONFIG_ZMK_POINTING=y

# Debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Battery
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=180  # Reduced frequency
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Display (helps with debugging)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y

# Studio
CONFIG_ZMK_STUDIO=y

# Zhu
# CONFIG_ZMK_MOUSE_SCROLL_DIVISOR=3
