# Basic settings
CONFIG_ZMK_KEYBOARD_NAME="CCK Ball"

# Bluetooth settings - FIXED
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# Better BLE connection intervals
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12  # Increased from 9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Disable deep sleep for better connectivity
CONFIG_ZMK_SLEEP=n  # CHANGED FROM y TO n
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=30000  # Reduced from 900000

# Better power management
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y

# Crystal settings
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y

# Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Mouse
CONFIG_ZMK_POINTING=y

# Debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Battery reporting
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# ZMK Studio
CONFIG_ZMK_STUDIO=y

# Zhu
# CONFIG_ZMK_MOUSE_SCROLL_DIVISOR=3
